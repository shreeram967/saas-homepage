<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f9fafc;
      color: #333;
    }

    .contact-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .contact-info h2 {
      margin-bottom: 15px;
      color: #4f46e5;
    }

    .contact-info p {
      margin-bottom: 10px;
      font-size: 15px;
    }

    .contact-info ul {
      list-style: none;
      margin-top: 15px;
    }

    .contact-info ul li {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .contact-form {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.08);
    }

    .contact-form h3 {
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-group textarea {
      resize: none;
      height: 120px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4f46e5;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #4338ca;
    }

    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="contact-container">

    <!-- Contact Info -->
    <div class="contact-info">
      <h2>Contact Us</h2>
      <p>We’d love to hear from you. Reach out with any questions or feedback.</p>

      <ul>
        <li>📍 Address: Erode, India</li>
        <li>📞 Phone: +91 88078 23150</li>
        <li>✉️ Email: support@saasify.com</li>
      </ul>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
      <h3>Send a Message</h3>

      <form>
        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Your Name" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Your Email" required>
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea placeholder="Your Message" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>

  </div>

</body>
</html>
